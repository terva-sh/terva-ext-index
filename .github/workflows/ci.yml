name: CI

# Runs on the public GitHub mirror (the curated `release` branch) and, where
# Forgejo Actions is enabled, on the internal `main` too — both read this file
# (Forgejo also looks under .github/workflows/). Mirrors `just ci`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A C compiler (preinstalled on ubuntu-latest) is required: the
      # tree-sitter grammar crates compile a small amount of C.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: test
        run: cargo test --release --locked
