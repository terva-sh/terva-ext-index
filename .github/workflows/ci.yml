name: CI

# GitHub only. Forgejo Actions also reads .github/workflows/, so without a guard
# this fires on every internal push as well — burning a runner to re-check what
# `just ci` already gates locally, against a runner image the internal instance
# may not even provide. The job-level `if` matches release.yml, which has always
# guarded this way; on Forgejo the workflow is still evaluated but the job is
# skipped. Mirrors `just ci`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A C compiler (preinstalled on ubuntu-latest) is required: the
      # tree-sitter grammar crates compile a small amount of C.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: test
        run: cargo test --release --locked
