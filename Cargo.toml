[package]
name = "terva-ext-index"
version = "0.8.2"
edition = "2021"
description = "terva index extension: emit a file's tree-sitter skeleton (imports + signatures with exact line ranges) instead of its body"
license = "MIT"
publish = false

[[bin]]
name = "terva-ext-index"
path = "src/main.rs"

[dependencies]
# The terva extension runtime: wire framing (4 MiB cap), handshake, Host
# dirs, the self-Jail, panic-isolated dispatch. A workspace-relative path
# dependency during SDK co-development; a release tree pins it instead
# (run.sh refuses to build when the sibling checkout is absent rather than
# silently falling back to a stale prebuilt).
terva-extsdk = { git = "https://github.com/terva-sh/terva-sdk-rust", tag = "v0.3.0" }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
# Markdown: the maintained MDeiml block grammar. Default features only — we use
# the `LANGUAGE: LanguageFn` const (via tree-sitter-language 0.1, the shared ABI
# bridge), NOT the optional `parser` feature, so it does not pull a second
# tree-sitter major into the tree.
tree-sitter-md = "0.5"
# Structured-config / data formats (key/section outlines, not code). Same
# `LANGUAGE: LanguageFn` ABI bridge (tree-sitter-language) as the grammars above,
# so no second tree-sitter major enters the tree. JSONC/comments are tolerated.
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
# Shell. Nearly every repo has scripts and they were falling through to
# "unsupported — use `read`". Same `tree-sitter-language` 0.1 ABI bridge, so the
# tree still holds exactly one tree-sitter major. Used for sh/bash/zsh: the
# grammar recovers on non-bash dialects, which costs declarations rather than
# producing wrong ones.
tree-sitter-bash = "0.25"
tree-sitter-xml = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"

# Test-only since the SDK migration: the binary itself no longer touches
# JSON (the SDK owns the wire), but the unit tests parse extension.json and
# the wire smoke test builds/asserts frames.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
